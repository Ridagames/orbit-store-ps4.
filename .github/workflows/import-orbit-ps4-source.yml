name: Import official Orbit Store PS4 0.1.0 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download official PS4 0.1.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/saawant12/orbit-store-ps4/releases/download/v0.1.0/orbit-store-0.1.0-source-bundle.zip"
          FILE="orbit-store-0.1.0-source-bundle.zip"
          EXPECTED="2947002612699d46f772961ff825689ee277f729028562f25f0eee036be39d57"

          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 "$URL" -o "$FILE"

          echo "$EXPECTED  $FILE" | sha256sum --check

      - name: Extract PS4 source into the repository
        shell: bash
        run: |
          set -euo pipefail
          DEST="vendor/orbit-store-ps4-0.1.0"
          mkdir -p "$DEST"
          unzip -q orbit-store-0.1.0-source-bundle.zip -d "$DEST"

          echo "Extracted source size:"
          du -sh "$DEST"
          echo "File count: $(find "$DEST" -type f | wc -l)"
          echo "Largest files:"
          find "$DEST" -type f -printf '%s\t%p\n' | sort -nr | head -n 30

      - name: Check GitHub individual file limit
        shell: bash
        run: |
          set -euo pipefail
          TOO_LARGE="$(find vendor/orbit-store-ps4-0.1.0 -type f -size +90M -print)"
          if [ -n "$TOO_LARGE" ]; then
            {
              echo "The archive was downloaded and extracted, but these files exceed the safe GitHub file limit:"
              printf '%s\n' "$TOO_LARGE"
            } | tee import-report.txt
            exit 23
          fi
          echo "All extracted files are below 90 MiB." | tee import-report.txt

      - name: Commit imported source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/orbit-store-ps4-0.1.0
          git commit -m "Import official Orbit Store PS4 source v0.1.0"
          git push origin HEAD:main

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-store-ps4-source-import-report
          path: import-report.txt
          if-no-files-found: ignore
          retention-days: 14
